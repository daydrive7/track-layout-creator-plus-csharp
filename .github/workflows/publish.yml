name: Publish verified release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check verified build and draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/42084246779 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42084246779 --jq .head_sha)" = e720153a80e56fb8a62fdd8f94b7a6b784ce92fa
          test "$(gh api repos/$GH_REPO/releases/435568004 --jq .draft)" = true
          gh run download 42084246779 --name TLCPlus-CSharp-win-x64 --dir portable
          mkdir assets
          gh release download v1.0.0 --pattern TLCPlus-CSharp-v1.0.0-source.zip --dir assets
      - name: Package and hash
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil,hashlib
          root=Path('portable');out=Path('assets')
          exe=next(root.rglob('TLCPlus.exe'));root=exe.parent
          assert (root/'Assets/locales/en.json').exists()
          shutil.copyfile(exe,out/'TLCPlus.exe')
          with zipfile.ZipFile(out/'TLCPlus-CSharp-v1.0.0-win-x64.zip','w',zipfile.ZIP_DEFLATED,compresslevel=5) as z:
              for p in root.rglob('*'):
                  if p.is_file() and p.name!='config.json' and p.suffix!='.pdb':z.write(p,Path('TLCPlus-CSharp')/p.relative_to(root))
          with zipfile.ZipFile(out/'TLCPlus-CSharp-v1.0.0-assets.zip','w',zipfile.ZIP_DEFLATED,compresslevel=5) as z:
              for p in (root/'Assets').rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(root))
          files=sorted(p for p in out.iterdir() if p.suffix in ['.exe','.zip'])
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
      - name: Upload and verify release files
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.0.0 assets/TLCPlus.exe assets/TLCPlus-CSharp-v1.0.0-win-x64.zip assets/TLCPlus-CSharp-v1.0.0-assets.zip assets/SHA256SUMS.txt --clobber
          gh api repos/$GH_REPO/releases/435568004 > remote.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          data=json.loads(Path('remote.json').read_text())
          expected={p.name:p for p in Path('assets').iterdir()}
          assert len(data['assets'])==5
          for asset in data['assets']:
              p=expected[asset['name']]
              assert asset['state']=='uploaded'
              assert asset['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          PY
          gh release edit v1.0.0 --draft=false --latest
