name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source commit to reproduce a verification failure
        required: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Verify
        shell: pwsh
        run: ./verify.ps1
      - name: Retain desktop verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verification
          path: |
            analysis/desktop-smoke-results.json
            analysis/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: TLCPlus-CSharp-win-x64
          path: release/TLCPlus-CSharp-v1.0.2/
